name: Import Remaining Audit Follow-up
on:
  push:
    branches: [fix-v9.4.1-remaining-audit]
    paths: ['.github/remaining-followup/**', '.github/workflows/import-remaining-followup.yml']
permissions:
  contents: write
concurrency:
  group: surveysync-remaining-followup-import
  cancel-in-progress: false
jobs:
  apply-reviewed-followup:
    if: github.repository == 'cpaul1988/SurveySync' && github.ref == 'refs/heads/fix-v9.4.1-remaining-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source identities and import reviewed follow-up
        run: |
          python .github/remaining-followup/apply.py
          git rm -r .github/remaining-followup
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Isolate external GIS Python environment and preserve template/release identities'
      - name: Format changed governed files with unchanged locked formatter
        run: |
          python -m pip install ruff==0.16.8
          python -m ruff format surveysync/gis_bridges.py surveysync/report_template_mapper.py
          git add -- surveysync/gis_bridges.py surveysync/report_template_mapper.py
          if ! git diff --cached --quiet; then
            git commit -m 'Format follow-up governed source without weakening quality checks'
          fi
      - name: Save only to isolated branch and retain source
        run: |
          git push origin HEAD:refs/heads/fix-v9.4.1-remaining-audit
          git rev-parse HEAD
          git archive --format=zip --output=remaining-followup-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: remaining-followup-source
          path: remaining-followup-source.zip
          retention-days: 14
