name: Format Reviewed GIS List Repair
on:
  push:
    branches: [fix-v9.4.1-remaining-audit]
    paths: ['surveysync/gis_bridges.py', '.github/workflows/format-gis-list.yml']
permissions:
  contents: write
jobs:
  format-one-reviewed-file:
    if: github.repository == 'cpaul1988/SurveySync' && github.ref == 'refs/heads/fix-v9.4.1-remaining-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the existing locked format and verify exact expected bytes
        run: |
          python -m pip install ruff==0.16.8
          python -m ruff format surveysync/gis_bridges.py
          test "$(git hash-object surveysync/gis_bridges.py)" = f3b2c0c79e93289951f2027c9a26fedcb4113f0b
          git add -- surveysync/gis_bridges.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply locked formatting to reviewed QGIS list parser'
          git push origin HEAD:refs/heads/fix-v9.4.1-remaining-audit
          git rev-parse HEAD
