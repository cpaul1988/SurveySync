name: SurveySync Defender Incident Investigation
on:
  push:
    branches: [fix/defender-release-954]
    paths: ['.github/workflows/defender-investigation.yml']
permissions:
  contents: read
concurrency:
  group: surveysync-defender-incident
  cancel-in-progress: false
jobs:
  withdraw-downloads:
    if: github.repository == 'cpaul1988/SurveySync'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Withdraw only the identified 9.5.3 downloads; retain evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          repo='cpaul1988/SurveySync'
          def api(path, data=None):
              cmd=['gh','api',path]
              if data is not None: cmd += ['--method','PATCH','--input','-']
              p=subprocess.run(cmd,input=json.dumps(data) if data is not None else None,text=True,capture_output=True)
              if p.returncode: raise RuntimeError(p.stderr)
              return json.loads(p.stdout)
          releases=api(f'repos/{repo}/releases?per_page=100')
          for r in releases:
              if r['tag_name'] not in {'v9.5.3','v9.5.3-beta.1'}: continue
              installer=[a for a in r['assets'] if a['name']=='SurveySync_Setup_9.5.3-beta.1.exe']
              if len(installer)!=1 or installer[0].get('digest')!='sha256:65b617f9a69aca551f68344124ef7f239afce10e4391edbc89f4d4cec9e09d95':
                  raise RuntimeError('Release identity changed; refuse an unverified withdrawal')
              warning='SECURITY HOLD — October 16, 2026. Microsoft Defender reported Trojan:Win32/Bearfoos.A!ml in the installed SurveySync.exe. The false-positive hypothesis is unconfirmed. This download is withdrawn pending investigation. Do not restore/exclude the detected launcher. Project files should not be deleted.\n\n---\n\n'
              body=r['body'] or ''
              if not body.startswith('SECURITY HOLD'): body=warning+body
              updated=api(f'repos/{repo}/releases/{r["id"]}',{'name':'[WITHDRAWN] SurveySync 9.5.3 — Defender investigation','draft':True,'prerelease':True,'make_latest':'false','body':body})
              assert updated['draft'] is True
              print('Withdrawn; retained as draft:',updated['tag_name'],updated['id'])
          PY
  extract-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download hash-pinned independently tested installer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38942210139 --repo cpaul1988/SurveySync --name SurveySync_9.5.3-beta.1_Verified_Installer --dir original-input
      - name: Verify package before non-executing extraction
        run: |
          echo '65b617f9a69aca551f68344124ef7f239afce10e4391edbc89f4d4cec9e09d95  original-input/SurveySync_Setup_9.5.3-beta.1.exe' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y innoextract
          mkdir -p security-evidence
          innoextract --version | tee security-evidence/extractor-version.txt
          innoextract --extract --output-dir original-unpacked original-input/SurveySync_Setup_9.5.3-beta.1.exe > security-evidence/extraction.log 2>&1
      - name: Record exact installed launcher hashes and Go build metadata
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('original-unpacked'); evidence=pathlib.Path('security-evidence'); entries=[]
          for name in ['SurveySync.exe','SurveySyncUpdater.exe']:
              paths=list(root.rglob(name))
              if len(paths)!=1: raise RuntimeError(f'Expected exactly one {name}: {paths}')
              p=paths[0]; data=p.read_bytes()
              if not data.startswith(b'MZ'): raise RuntimeError('Invalid PE')
              entries.append({'path':str(p),'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              info=subprocess.run(['go','version','-m',str(p)],text=True,capture_output=True,check=True)
              (evidence/(name+'.buildinfo.txt')).write_text(info.stdout)
          (evidence/'original-binaries.json').write_text(json.dumps(entries,indent=2))
          print(json.dumps(entries,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: incident-953-original-unpacked
          path: original-unpacked/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incident-953-extraction-evidence
          path: security-evidence/
          retention-days: 30
  scan-original:
    needs: extract-original
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Prepare fresh Microsoft Defender scan environment
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force security-evidence | Out-Null
          Get-MpComputerStatus | ConvertTo-Json -Depth 5 | Set-Content security-evidence/defender-before.json
          Get-MpPreference | Select-Object DisableRealtimeMonitoring,DisableBehaviorMonitoring,DisableIOAVProtection,MAPSReporting,SubmitSamplesConsent,ExclusionPath,ExclusionProcess | ConvertTo-Json -Depth 5 | Set-Content security-evidence/defender-preferences.json
          if ((Get-Service WinDefend).Status -ne 'Running') { Start-Service WinDefend }
          Update-MpSignature -ErrorAction Stop
          $status=Get-MpComputerStatus
          $status | ConvertTo-Json -Depth 5 | Set-Content security-evidence/defender-updated.json
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) { throw 'Microsoft Defender is unavailable; cannot report a clean scan.' }
      - uses: actions/download-artifact@v4
        with:
          name: incident-953-original-unpacked
          path: original-unpacked
      - name: Scan original files without running any application or installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $platform=Get-ChildItem "$env:ProgramData/Microsoft/Windows Defender/Platform" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          $mp=if ($platform) { Join-Path $platform.FullName 'MpCmdRun.exe' } else { "$env:ProgramFiles/Windows Defender/MpCmdRun.exe" }
          $root=(Resolve-Path original-unpacked).Path
          $inventory=@(Get-ChildItem $root -File -Recurse | ForEach-Object { [pscustomobject]@{path=$_.FullName;size=$_.Length;sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()} })
          $inventory | ConvertTo-Json -Depth 5 | Set-Content security-evidence/original-pre-scan-hashes.json
          foreach ($name in @('SurveySync.exe','SurveySyncUpdater.exe')) { if (@($inventory | Where-Object { [IO.Path]::GetFileName($_.path) -eq $name }).Count -ne 1) { throw "Missing or quarantined original launcher: $name" } }
          # Detection-only custom scan ignores file exclusions and includes archives.
          # It does not disable real-time protection or allow any file to execute.
          & $mp -Scan -ScanType 3 -File $root -DisableRemediation 2>&1 | Tee-Object security-evidence/original-scan.txt
          $code=$LASTEXITCODE
          [pscustomobject]@{exit_code=$code;scan_utc=[DateTime]::UtcNow.ToString('o');interpretation='Diagnostic scan only. Code zero alone is not vendor false-positive clearance.'} | ConvertTo-Json | Set-Content security-evidence/original-scan-result.json
          if ($code -ne 0) { throw "Original artifact scan reported detection or error: $code" }
          foreach ($item in $inventory) { if (-not (Test-Path -LiteralPath $item.path) -or (Get-FileHash -LiteralPath $item.path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $item.sha256) { throw 'Original file changed or was remediated during scan.' } }
      - name: Collect Defender outcome even when the original is blocked
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force security-evidence | Out-Null
          Get-MpComputerStatus | ConvertTo-Json -Depth 5 | Set-Content security-evidence/defender-after.json
          @(Get-MpThreatDetection -ErrorAction SilentlyContinue) | ConvertTo-Json -Depth 8 | Set-Content security-evidence/defender-detections.json
          Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Windows Defender/Operational';Id=1116,1117,5007;StartTime=(Get-Date).AddHours(-1)} -ErrorAction SilentlyContinue | Select-Object TimeCreated,Id,Message | ConvertTo-Json -Depth 6 | Set-Content security-evidence/defender-events.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incident-953-defender-evidence
          path: security-evidence/
          retention-days: 30
