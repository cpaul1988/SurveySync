name: Prepare Numbered 9.4.2 Candidate
on:
  push:
    branches: [fix-v9.4.1-remaining-audit]
    paths: ['.github/prepare942/**', '.github/workflows/prepare-942.yml']
permissions:
  contents: write
concurrency:
  group: surveysync-942-source-import
  cancel-in-progress: false
jobs:
  import-reviewed-candidate:
    if: github.repository == 'cpaul1988/SurveySync' && github.ref == 'refs/heads/fix-v9.4.1-remaining-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import reviewed candidate and retain full release checks
        run: |
          python .github/prepare942/apply.py
          git rm -r .github/prepare942
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare 9.4.2-beta.1 identity, real beta replacement and repeated lifecycle acceptance'
      - name: Apply unchanged governed formatting
        run: |
          python -m pip install ruff==0.16.8
          python -m ruff format scripts/release_gate.py
          git add -- scripts/release_gate.py
          if ! git diff --cached --quiet; then
            git commit -m 'Format candidate release gate with the locked formatter'
          fi
      - name: Save only to the isolated candidate branch
        run: |
          git push origin HEAD:refs/heads/fix-v9.4.1-remaining-audit
          git rev-parse HEAD
          git archive --format=zip --output=numbered-candidate-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: numbered-candidate-source
          path: numbered-candidate-source.zip
          retention-days: 14
