name: SurveySync Repair Acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: surveysync-repair-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed-windows:
    if: github.repository == 'cpaul1988/SurveySync'
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install locked application and test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Prepare isolated browser validation
        run: |
          python -m pip install playwright==1.57.0 pywinauto==0.6.9 psutil==7.0.0 cryptography==45.0.7
          python -m playwright install chromium
      - name: Windows native updater component regressions
        shell: pwsh
        run: |
          go test ./installer/app_launcher.go ./installer/app_launcher_test.go
          if ($LASTEXITCODE -ne 0) { throw 'Launcher regression failed.' }
          go test ./installer/update_helper.go ./installer/update_helper_test.go
          if ($LASTEXITCODE -ne 0) { throw 'Updater regression failed.' }
      - name: Regenerate canonical globe assets
        shell: pwsh
        run: ./scripts/generate_surveysync_icon.ps1
      - name: Full unchanged release gate with repair regressions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force repair-evidence | Out-Null
          python scripts/release_gate.py 2>&1 | Tee-Object repair-evidence/release-gate.log
          if ($LASTEXITCODE -ne 0) { throw 'Unchanged release gate failed.' }
      - name: Exercise repaired commands and level-layout control
        run: python scripts/verify_repaired_ui.py
      - name: Preserve module and theme acceptance
        run: |
          python scripts/ui_browser_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Module UI acceptance failed.' }
          python scripts/theme_branding_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Theme acceptance failed.' }
      - name: Install Inno Setup on disposable runner
        run: choco install innosetup --yes --no-progress
      - name: Build unreleased repair installer with the full gate
        shell: pwsh
        run: |
          ./Build_SurveySync.ps1 2>&1 | Tee-Object repair-evidence/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Candidate compilation failed.' }
      - name: Install the real candidate in the runner temporary directory
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'SurveySync_Repair_Test'
          if (Test-Path $install) { throw 'Disposable installation already exists.' }
          $releaseId = (Get-Content RELEASE_ID.txt -Raw).Trim()
          $setup = (Resolve-Path "installer/output/SurveySync_Setup_$releaseId.exe").Path
          $log = Join-Path $env:GITHUB_WORKSPACE 'repair-evidence/setup.log'
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="'+$install+'"'),('/LOG="'+$log+'"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Setup failed with code $($process.ExitCode)." }
          "SS_REPAIR_INSTALL=$install" >> $env:GITHUB_ENV
          $digest = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "SS_INSTALLER_SHA256=$digest" >> $env:GITHUB_ENV
      - name: Installed-native control, shutdown and reopen acceptance
        run: python scripts/verify_repaired_native.py
      - name: Real installed WebView2 file picker, report export, and File Exit
        run: python scripts/verify_native_controls.py
      - name: Twenty-four lifecycle cycles on the exact numbered candidate
        run: python scripts/verify_lifecycle_stress.py
      - name: Download hash-pinned released 9.4.1 migration baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v9.4.1 --repo cpaul1988/SurveySync --pattern SurveySync_Setup_9.4.1.exe --dir released-baseline
      - name: Download hash-pinned released migration baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v9.4.0-beta.4 --repo cpaul1988/SurveySync --pattern SurveySync_Setup_9.4.0.exe --dir released-baseline
      - name: Real numbered-beta and released-version HTTPS replacement cycles
        run: python scripts/verify_update_cycle.py
      - name: Preserve successfully tested installer only as an unpublished artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurveySync_9.4.9_beta1_Verified_Installer
          path: |
            installer/output/SurveySync_Setup_9.4.9-beta.1.exe
            installer/output/SurveySync_Setup_9.4.9-beta.1.exe.sha256
            RELEASE_NOTES_v9_4_9.md
            QA_REPORT_v9_4_9.md
            VERSION.txt
            RELEASE_ID.txt
          if-no-files-found: error
          retention-days: 14
      - name: Collect runtime diagnostics and exact source
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force repair-evidence | Out-Null
          $log = Join-Path $env:LOCALAPPDATA 'SurveySync/logs/setup_runtime.log'
          if (Test-Path $log) { Copy-Item $log repair-evidence/setup-runtime.log }
          git rev-parse HEAD | Set-Content repair-evidence/tested-source.txt
          git archive --format=zip --output=repair-evidence/tested-source.zip HEAD
      - name: Retain actual evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SurveySync_Repair_Acceptance_Evidence
          path: |
            repair-evidence/
            lifecycle-evidence/
            ui-evidence/
            coverage.xml
          retention-days: 14
