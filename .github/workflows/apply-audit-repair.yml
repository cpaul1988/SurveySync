name: Import Saved Audit Repairs
on:
  push:
    branches: [fix-v9.4.0-verified-audit]
    paths: ['.github/repair-payload/**', '.github/workflows/apply-audit-repair.yml']
permissions:
  contents: write
concurrency:
  group: surveysync-repair-import
  cancel-in-progress: false
jobs:
  import-reviewed-source:
    if: github.repository == 'cpaul1988/SurveySync' && github.ref == 'refs/heads/fix-v9.4.0-verified-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and import the exact saved repair package
        run: |
          python .github/repair-payload/apply.py
          git rm -r .github/repair-payload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import hash-verified 9.4 audit repairs and 77 regression cases (unreleased)'
      - name: Apply existing release-gate formatting to changed governed files
        run: |
          python -m pip install ruff==0.16.8
          python -m ruff format surveysync/api_models.py surveysync/survey_routes.py surveysync/control_exports.py surveysync/cogo_extended.py
          git add -- surveysync/api_models.py surveysync/survey_routes.py surveysync/control_exports.py surveysync/cogo_extended.py
          if ! git diff --cached --quiet; then
            git commit -m 'Format repaired governed sources with the locked Ruff version'
          fi
      - name: Save source only to the isolated repair branch
        run: |
          git push origin HEAD:refs/heads/fix-v9.4.0-verified-audit
          git rev-parse HEAD
          git archive --format=zip --output=verified-repair-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: verified-repair-source
          path: verified-repair-source.zip
          retention-days: 14
