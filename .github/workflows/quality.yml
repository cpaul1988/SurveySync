name: SurveySync Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: read
jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify clean production runtime
        shell: pwsh
        run: |
          $prodVenv = Join-Path $env:RUNNER_TEMP 'surveysync-prod-verify'
          if (Test-Path $prodVenv) { Remove-Item -Recurse -Force $prodVenv }
          python -m venv $prodVenv
          & (Join-Path $prodVenv 'Scripts\python.exe') -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          if ($LASTEXITCODE -ne 0) { throw 'Production requirements.lock install failed.' }
          & (Join-Path $prodVenv 'Scripts\python.exe') -c "import surveysync.landxml_io,surveysync.router; print('SurveySync clean production runtime READY')"
          if ($LASTEXITCODE -ne 0) { throw 'Production startup import smoke test failed.' }
      - name: Verify SurveySync 9.4 Windows brand icon
        shell: pwsh
        run: |
          .\scripts\generate_surveysync_icon.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Brand icon generation failed.' }
          $icon = Get-Item .\branding\SurveySync.ico
          if ($icon.Length -lt 1000) { throw 'Generated SurveySync.ico is unexpectedly small.' }
          $bytes = [System.IO.File]::ReadAllBytes($icon.FullName)
          if ($bytes[0] -ne 0 -or $bytes[1] -ne 0 -or $bytes[2] -ne 1 -or $bytes[3] -ne 0) { throw 'Generated SurveySync.ico has an invalid ICO header.' }
          Write-Host "SurveySync 9.4 ICO READY: $($icon.Length) bytes"
      - run: python scripts/release_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
