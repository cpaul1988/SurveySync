name: Apply Reviewed Canonical Point Contract
on:
  push:
    branches: [fix-v9.4.0-verified-audit]
    paths: ['.github/canonical-contract.patch', '.github/workflows/apply-point-contract.yml']
permissions:
  contents: write
jobs:
  apply-reviewed-patch:
    if: github.repository == 'cpaul1988/SurveySync' && github.ref == 'refs/heads/fix-v9.4.0-verified-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply only the reviewed point-import and acceptance changes
        run: |
          git apply --check .github/canonical-contract.patch
          git apply .github/canonical-contract.patch
          git rm .github/canonical-contract.patch
          git add -- surveysync/router.py scripts/verify_update_cycle.py RELEASE_NOTES_v9_4_1.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix canonical PointID import and reject invalid rows without partial insertion'
          git push origin HEAD:refs/heads/fix-v9.4.0-verified-audit
          git rev-parse HEAD
