name: FBR-0018 Candidate Validation
on:
  push:
    branches: [fix/fbr0018-integration]
permissions:
  contents: read
concurrency:
  group: fbr0018-candidate-apply
  cancel-in-progress: false
jobs:
  apply-verified-candidate:
    if: github.ref == 'refs/heads/fix/fbr0018-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply checksum-verified locally tested source
        run: python .candidate/fbr0018/apply.py
