name: Prepare SurveySync Security Candidate
on:
  push:
    branches: [fix/defender-release-954]
    paths: ['.github/workflows/prepare-security-954.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'cpaul1988/SurveySync'
    runs-on: windows-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact Windows preimages and validate prepared metadata
        run: |
          python .github/scripts/prepare_security_candidate_954.py
          python - <<'PY'
          from pathlib import Path
          ui=Path('.github/workflows/ui-validation.yml')
          text=ui.read_text(encoding='utf-8').replace('RELEASE_NOTES_v9_5_3.md','RELEASE_NOTES_v9_5_4.md')
          marker='          path: ui-evidence/'
          assert text.count(marker)==1
          text=text.replace(marker,'          path: |\n            ui-evidence/\n            security-evidence/\n            build/native/native-provenance.json')
          ui.write_text(text,encoding='utf-8')
          repair=Path('.github/workflows/repair-acceptance.yml')
          text=repair.read_text(encoding='utf-8')
          marker='            repair-evidence/\n'
          assert text.count(marker)==1
          text=text.replace(marker,marker+'            security-evidence/\n            build/native/native-provenance.json\n')
          repair.write_text(text,encoding='utf-8')
          PY
          python scripts/validate_release_identity.py
          python scripts/validate_release_docs.py
          python scripts/validate_static_quality.py
          git diff --check
      - name: Store content blobs only for authorized tree update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess,hashlib
          repo='cpaul1988/SurveySync'; parent=os.environ['GITHUB_SHA']
          def api(path,data=None):
              cmd=['gh','api',path]
              if data is not None:cmd+=['--method','POST','--input','-']
              result=subprocess.run(cmd,input=json.dumps(data) if data is not None else None,text=True,encoding='utf-8',capture_output=True)
              if result.returncode: raise RuntimeError(result.stderr+'\n'+result.stdout[:1000])
              return json.loads(result.stdout)
          base=api(f'repos/{repo}/git/commits/{parent}')['tree']['sha']
          names=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          if len(names)!=20:raise RuntimeError('Unexpected modified file set')
          elements=[]; hashes={}
          for name in names:
              text=pathlib.Path(name).read_text(encoding='utf-8')
              blob=api(f'repos/{repo}/git/blobs',{'content':text,'encoding':'utf-8'})['sha']
              elements.append({'path':name,'mode':'100644','type':'blob','sha':blob})
              hashes[name]=hashlib.sha256(text.encode('utf-8')).hexdigest()
          elements += [{'path':n,'mode':'100644','type':'blob','sha':None} for n in ['.github/workflows/prepare-security-954.yml','.github/scripts/prepare_security_candidate_954.py']]
          report={'parent':parent,'base_tree_sha':base,'tree_elements':elements,'postimage_sha256':hashes,'branch':'fix/defender-release-954','branch_updated':False}
          pathlib.Path('prepared-commit.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-security-commit
          path: prepared-commit.json
          retention-days: 7
