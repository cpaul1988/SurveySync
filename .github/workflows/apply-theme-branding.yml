name: Apply reviewed theme branding source
on:
  push:
    branches: [v9.4.0-beta4-theme-branding]
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'cpaul1988/SurveySync' && github.ref == 'refs/heads/v9.4.0-beta4-theme-branding'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact reviewed source migration
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/apply_beta4_source.py ]; then
            python3 scripts/apply_beta4_source.py
            git rm scripts/apply_beta4_source.py
            git add -u
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Apply Beta.4 theme-only EDSI co-branding to both shells'
            git push origin HEAD:refs/heads/v9.4.0-beta4-theme-branding
          fi
