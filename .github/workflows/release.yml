name: SurveySync Release
on:
  push:
    branches: [fix-v9.4.0-verified-audit, fix-v9.4.1-remaining-audit, feature/visual-survey-qa, feature/qa-review-reports, feature/revision-review-workflow]
    paths: ['.github/release-941.json', '.github/release-942.json', '.github/release-943.json', '.github/release-944.json', '.github/release-945.json']
  workflow_dispatch:
    inputs:
      version:
        description: Version matching VERSION.txt
        required: true
      action:
        description: Publish Beta or promote the exact tested Beta artifact
        required: true
        type: choice
        options: [publish_beta, promote_stable]
      beta_suffix:
        description: Prerelease suffix to publish/promote (beta, beta.2, beta.3, ...)
        required: true
        default: beta.4
permissions:
  contents: write
concurrency:
  group: surveysync-release
  cancel-in-progress: false
env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_REPO: ${{ github.repository }}
  BETA_SUFFIX: ${{ inputs.beta_suffix }}

jobs:
  verified_patch:
    name: Publish independently accepted 9.4.1 (no rebuild)
    if: github.event_name == 'push' && github.repository == 'cpaul1988/SurveySync' && github.ref == 'refs/heads/fix-v9.4.0-verified-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify publisher safeguards offline
        run: python -m unittest discover -s .github/scripts/tests -p test_publish_verified_941.py -v
      - name: Verify Windows provenance and publish exact accepted installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_verified_941.py

  verified_942:
    name: Publish independently accepted 9.4.2 (no rebuild)
    if: github.event_name == 'push' && github.repository == 'cpaul1988/SurveySync' && github.ref == 'refs/heads/fix-v9.4.1-remaining-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify publisher safeguards offline
        run: python -m unittest discover -s .github/scripts/tests -p test_publish_verified_942.py -v
      - name: Verify Windows provenance and publish exact accepted installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_verified_942.py

  verified_943:
    name: Publish independently accepted 9.4.3 (no rebuild)
    if: github.event_name == 'push' && github.repository == 'cpaul1988/SurveySync' && github.ref == 'refs/heads/feature/visual-survey-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify publisher safeguards offline
        run: python -m unittest discover -s .github/scripts/tests -p test_publish_verified_943.py -v
      - name: Verify Windows provenance and publish exact accepted installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_verified_943.py

  verified_944:
    name: Publish independently accepted 9.4.4 (no rebuild)
    if: github.event_name == 'push' && github.repository == 'cpaul1988/SurveySync' && github.ref == 'refs/heads/feature/qa-review-reports'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify publisher safeguards offline
        run: python -m unittest discover -s .github/scripts/tests -p test_publish_verified_944.py -v
      - name: Verify Windows provenance and publish exact accepted installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_verified_944.py

  verified_945:
    name: Publish independently accepted 9.4.5 (no rebuild)
    if: github.event_name == 'push' && github.repository == 'cpaul1988/SurveySync' && github.ref == 'refs/heads/feature/revision-review-workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify publisher safeguards offline
        run: python -m unittest discover -s .github/scripts/tests -p test_publish_verified_945.py -v
      - name: Verify Windows provenance and publish exact accepted installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_verified_945.py

  beta_approved:
    name: Publish approved Beta.4 (no rebuild)
    if: ${{ inputs.action == 'publish_beta' && inputs.version == '9.4.0' && inputs.beta_suffix == 'beta.4' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the exact approved Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '10923766429'
          run-id: '36294542913'
          github-token: ${{ github.token }}
          repository: cpaul1988/SurveySync
          merge-multiple: true
          path: approved-beta4
      - name: Test publisher draft recovery and integrity safeguards (offline)
        run: python -m unittest discover -s .github/scripts/tests -p test_publish_approved_beta4.py -v
      - name: Verify approved bytes, publish prerelease, and update beta feed only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_approved_beta4.py

  beta:
    if: ${{ inputs.action == 'publish_beta' && !(inputs.version == '9.4.0' && inputs.beta_suffix == 'beta.4') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require exact pre-created Beta tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            throw 'Beta publication must run from a tested development/candidate branch, not main.'
          }
          if ($env:BETA_SUFFIX -notmatch '^beta(?:\.[0-9]+)?$') {
            throw 'beta_suffix must be beta or beta.N.'
          }
          $tag="v$env:RELEASE_VERSION-$env:BETA_SUFFIX"
          $remoteTag=(git ls-remote origin "refs/tags/$tag" | ForEach-Object { ($_ -split "`t")[0] })
          if (-not $remoteTag) {
            throw "Pre-create $tag at the exact tested candidate SHA before publishing Beta."
          }
          if ($remoteTag -ne $env:GITHUB_SHA) {
            throw "Beta tag $tag points to $remoteTag but workflow is building $env:GITHUB_SHA."
          }
          Write-Host "Verified $tag -> $remoteTag"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Validate version and notes
        shell: pwsh
        run: |
          $v=(Get-Content VERSION.txt -Raw).Trim()
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$' -or $v -ne $env:RELEASE_VERSION) {
            throw 'Requested version does not match VERSION.txt.'
          }
          $notes="RELEASE_NOTES_v$($v.Replace('.', '_')).md"
          if (!(Test-Path $notes)) { throw "Missing $notes" }
          "RELEASE_NOTES=$notes" >> $env:GITHUB_ENV

      - name: Install locked build and test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Verify clean production runtime
        shell: pwsh
        run: |
          $prodVenv = Join-Path $env:RUNNER_TEMP 'surveysync-prod-verify'
          if (Test-Path $prodVenv) { Remove-Item -Recurse -Force $prodVenv }
          python -m venv $prodVenv
          & (Join-Path $prodVenv 'Scripts\python.exe') -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          if ($LASTEXITCODE -ne 0) { throw 'Production requirements.lock install failed.' }
          & (Join-Path $prodVenv 'Scripts\python.exe') -c "import surveysync.landxml_io,surveysync.router; print('SurveySync clean production runtime READY')"
          if ($LASTEXITCODE -ne 0) { throw 'Production startup import smoke test failed.' }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Run shared gate and build Windows installer
        shell: pwsh
        run: ./Build_SurveySync.ps1

      - name: Retain coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

      - name: Publish Beta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag="v$env:RELEASE_VERSION-$env:BETA_SUFFIX"
          $p="installer/output/SurveySync_Setup_$env:RELEASE_VERSION.exe"
          gh release create $tag $p "$p.sha256" $env:RELEASE_NOTES --verify-tag --title "SurveySync $env:RELEASE_VERSION [$env:BETA_SUFFIX]" --notes-file $env:RELEASE_NOTES --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Beta publication failed.' }

          $url="https://github.com/$env:RELEASE_REPO/releases/download/$tag/SurveySync_Setup_$env:RELEASE_VERSION.exe"
          python scripts/update_manifest.py --channel beta --version $env:RELEASE_VERSION --installer $p --installer-url $url --release-tag $tag --release-notes-file $env:RELEASE_NOTES
          if ($LASTEXITCODE -ne 0) { throw 'Manifest update failed.' }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git commit -m "Publish SurveySync $env:RELEASE_VERSION $env:BETA_SUFFIX manifest"
          if ($LASTEXITCODE -ne 0) { throw 'Manifest commit failed.' }
          git push
          if ($LASTEXITCODE -ne 0) { throw 'Manifest push failed.' }

  promote:
    if: ${{ inputs.action == 'promote_stable' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require Stable promotion from main
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Stable promotion must run from main after the tested Beta candidate has been merged. Current ref: $env:GITHUB_REF"
          }
          if ($env:BETA_SUFFIX -notmatch '^beta(?:\.[0-9]+)?$') {
            throw 'beta_suffix must be beta or beta.N.'
          }

      - name: Promote exact Beta artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v=(Get-Content VERSION.txt -Raw).Trim()
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$' -or $v -ne $env:RELEASE_VERSION) {
            throw 'Version mismatch.'
          }

          $notes="RELEASE_NOTES_v$($v.Replace('.', '_')).md"
          if (!(Test-Path $notes)) { throw 'Release notes missing.' }

          $tag="v$env:RELEASE_VERSION-$env:BETA_SUFFIX"
          New-Item -ItemType Directory -Force release | Out-Null
          gh release download $tag --pattern "SurveySync_Setup_$env:RELEASE_VERSION.exe" --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Beta download failed.' }

          $p="release/SurveySync_Setup_$env:RELEASE_VERSION.exe"
          $url="https://github.com/$env:RELEASE_REPO/releases/download/$tag/SurveySync_Setup_$env:RELEASE_VERSION.exe"
          python scripts/update_manifest.py --channel stable --version $env:RELEASE_VERSION --installer $p --installer-url $url --release-tag $tag --release-notes-file $notes --promoted-from beta
          if ($LASTEXITCODE -ne 0) { throw 'Beta integrity verification failed.' }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Promote SurveySync $env:RELEASE_VERSION $env:BETA_SUFFIX artifact to stable"
            if ($LASTEXITCODE -ne 0) { throw 'Manifest commit failed.' }
            git push
            if ($LASTEXITCODE -ne 0) { throw 'Manifest push failed.' }
          }
          gh release edit $tag --repo $env:RELEASE_REPO --prerelease=false --latest --title "SurveySync $env:RELEASE_VERSION [stable]"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release-status promotion failed.' }
          $latest = gh api "repos/$env:RELEASE_REPO/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0 -or $latest -ne $tag) { throw 'GitHub Latest verification failed.' }
