name: Complete Candidate Cache Identity
on:
  push:
    branches: [fix-v9.4.1-remaining-audit]
    paths: ['.github/cache942.json', '.github/workflows/cache-942.yml']
permissions:
  contents: write
jobs:
  apply-reviewed-cache-contract:
    if: github.repository == 'cpaul1988/SurveySync' && github.ref == 'refs/heads/fix-v9.4.1-remaining-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact source and complete panel cache identity
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          items=json.loads(Path('.github/cache942.json').read_text())
          allowed={'surveysync/static/index.html','scripts/validate_release_identity.py','tests/test_release_stamp_contract.py'}
          assert len(items)==3 and {i['path'] for i in items}==allowed
          writes=[]
          for item in items:
              path=Path(item['path']);old=path.read_text(encoding='utf-8')
              assert hashlib.sha256(old.encode()).hexdigest()==item['before'],item['path']
              assert old.count(item['old'])==1,item['path']
              new=old.replace(item['old'],item['new'])
              assert hashlib.sha256(new.encode()).hexdigest()==item['after'],item['path']
              writes.append((path,new))
          for path,new in writes:
              path.write_text(new,encoding='utf-8')
          PY
          python -m py_compile scripts/validate_release_identity.py tests/test_release_stamp_contract.py
          git add -- surveysync/static/index.html scripts/validate_release_identity.py tests/test_release_stamp_contract.py
          git rm .github/cache942.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Version the remaining panel script and reject stale script/style cache identities'
          git push origin HEAD:refs/heads/fix-v9.4.1-remaining-audit
          git rev-parse HEAD
