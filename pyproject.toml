[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F821", "F822", "F823"]

[tool.mypy]
python_version = "3.12"
files = ["surveysync/topo", "surveysync/control_math.py", "surveysync/cogo_extended.py", "surveysync/network_adjustment.py", "surveysync/level_network.py", "surveysync/earthwork.py", "surveysync/horizontal_alignment.py", "surveysync/landxml_io.py", "surveysync/api_models.py", "fieldbook_sync/api_models.py", "fieldbook_sync/rod_height_qc.py"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["surveysync", "fieldbook_sync"]

[tool.coverage.report]
show_missing = false
fail_under = 54
