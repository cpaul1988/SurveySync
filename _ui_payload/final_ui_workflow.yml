name: SurveySync UI Validation
on:
  push:
    branches: [v9.4.0-beta3-unified-ui]
  pull_request:
permissions:
  contents: read
jobs:
  browser-ui:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked application and test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install isolated browser QA tooling
        run: python -m pip install playwright==1.57.0
      - run: python -m playwright install chromium
      - name: Regenerate every globe branding surface
        shell: pwsh
        run: ./scripts/generate_surveysync_icon.ps1
      - name: Static assets and release-note regression tests
        run: python -m pytest -q tests/test_beta3_ui.py tests/test_v940_branding.py tests/test_v940_beta2_brand_release_notes.py
      - name: Real application light and dark browser checks
        run: python scripts/ui_browser_smoke.py
      - name: Retain actual UI screenshots and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surveysync-ui-evidence
          path: ui-evidence/
          retention-days: 14
      - name: Retain exact tested source
        if: always()
        shell: pwsh
        run: git archive --format=zip --output=source-for-ui-validation.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-for-ui-validation
          path: source-for-ui-validation.zip
          retention-days: 3
